<style>
:root{
  --bg:#F5F1E7; --surface:#FFFFFF; --border:#DCD0B3; --border-strong:#C7B892;
  --ink:#28211A; --ink-muted:#746A57; --accent:#A6551F; --accent-strong:#8B4415; --accent-ink:#FFF8EE;
  --bad:#A93A2C; --shadow:0 1px 2px rgba(40,33,26,.06), 0 8px 24px -12px rgba(40,33,26,.18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#171310; --surface:#1F1A14; --border:#3C3125; --border-strong:#4C3E2D;
    --ink:#F1E8D8; --ink-muted:#B4A88F; --accent:#E0904F; --accent-strong:#EFA868; --accent-ink:#211405;
    --bad:#E48475; --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 28px -12px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
*{box-sizing:border-box;}
body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
  background:var(--bg); color:var(--ink); font-family:"Work Sans",-apple-system,BlinkMacSystemFont,sans-serif;}
.card{width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border); border-radius:12px;
  box-shadow:var(--shadow); padding:30px 28px;}
.mark{width:38px; height:38px; color:var(--accent); margin-bottom:14px;}
h1{font-family:"Fraunces","Iowan Old Style",serif; font-weight:600; font-size:1.45rem; margin:0 0 4px; letter-spacing:-.01em;}
p{margin:0 0 22px; color:var(--ink-muted); font-size:.88rem; line-height:1.5;}
label{display:block; font-size:.75rem; font-weight:600; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); margin-bottom:6px;}
input{width:100%; font:inherit; font-size:.95rem; padding:10px 12px; border:1px solid var(--border-strong); border-radius:8px;
  background:var(--surface); color:var(--ink);}
input:focus-visible, button:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
button{margin-top:16px; width:100%; font:inherit; font-weight:600; font-size:.92rem; padding:11px 16px; border-radius:8px;
  border:1px solid var(--accent); background:var(--accent); color:var(--accent-ink); cursor:pointer;}
button:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
button:disabled{opacity:.6; cursor:wait;}
.error{min-height:1.3em; margin-top:10px; font-size:.84rem; color:var(--bad);}
.fine{margin-top:18px; font-size:.74rem; color:var(--ink-muted); line-height:1.5;}
</style>

const SESSION_KEY = "stammenlijst:unlock:" + (PAYLOAD && PAYLOAD.id);
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));

async function decryptWith(key){
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(PAYLOAD.iv) }, key, b64d(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
// replace this login page by the app — only once the login page has fully loaded: while the parser is
// still running, document.write would insert the app next to the login form instead of replacing it
function show(html){
  const swap = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === "complete") swap();
  else window.addEventListener("load", swap, { once: true });
}

async function unlock(password){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64d(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  const html = await decryptWith(key); // throws on a wrong password
  try { sessionStorage.setItem(SESSION_KEY, b64e(await crypto.subtle.exportKey("raw", key))); } catch(e){}
  show(html);
}

(async () => {
  let saved = null;
  try { saved = sessionStorage.getItem(SESSION_KEY); } catch(e){}
  if (saved){
    try {
      const key = await crypto.subtle.importKey("raw", b64d(saved), { name: "AES-GCM" }, false, ["decrypt"]);
      show(await decryptWith(key));
      return;
    } catch(e){ try { sessionStorage.removeItem(SESSION_KEY); } catch(_){} }
  }
})();

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Bezig…"; err.textContent = "";
  try { await unlock(document.getElementById("pw").value); }
  catch(x){
    err.textContent = "Dat wachtwoord klopt niet.";
    btn.disabled = false; btn.textContent = "Openen";
    document.getElementById("pw").select();
  }
});
</script>
